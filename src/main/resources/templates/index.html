<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Drone Hub - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">🚁 Drone Port Hub</a>
    <div class="navbar-nav">
        <a class="nav-link active" href="/">Home</a>
        <a class="nav-link" href="/pads">Landing Pads</a>
        <a class="nav-link" href="/dockings">Docking & Flights</a>
        <a class="nav-link" href="/invoices">Billing & Invoices</a>
        <a class="nav-link" href="/reports">Financial Reports</a>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4 fw-bold">Urban Air Mobility Logistics Hub</h2>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-primary">
                <h5>Configured Landing Pads</h5>
                <h2 class="text-primary" th:text="${totalPads}">0</h2>
                <a href="/pads" class="btn btn-outline-primary btn-sm mt-2">Manage Pads</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-warning">
                <h5>Active Docking Events</h5>
                <h2 class="text-warning" th:text="${activeDocks}">0</h2>
                <a href="/dockings" class="btn btn-outline-warning btn-sm mt-2">Track Docks</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-success">
                <h5>Invoices & Bills</h5>
                <h2 class="text-success" th:text="${totalInvoices}">0</h2>
                <a href="/invoices" class="btn btn-outline-success btn-sm mt-2">View Accounting</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
