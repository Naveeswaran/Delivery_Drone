<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Financial Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/">🚁 Drone Port Hub</a>
    <div class="navbar-nav">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/pads">Landing Pads</a>
        <a class="nav-link" href="/dockings">Docking & Flights</a>
        <a class="nav-link" href="/invoices">Billing & Invoices</a>
        <a class="nav-link active" href="/reports">Financial Reports</a>
    </div>
</nav>

<div class="container py-4">
    <h3 class="fw-bold mb-4">Vertiport Operating P&L Report</h3>
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <table class="table align-middle">
                    <tr>
                        <td class="text-success fw-bold">Total Docking Revenues (Income):</td>
                        <td class="text-end fw-bold fs-5 text-success" th:text="'$' + ${revenue}"></td>
                    </tr>
                    <tr>
                        <td class="text-danger fw-bold">Pad & Radar Maintenance (Expenses):</td>
                        <td class="text-end fw-bold fs-5 text-danger" th:text="'-$' + ${expenses}"></td>
                    </tr>
                    <tr class="table-active">
                        <td class="fw-bold fs-5">Net Operating Margin:</td>
                        <td class="text-end fw-bold fs-4" th:classappend="${netProfit >= 0 ? 'text-success' : 'text-danger'}" th:text="'$' + ${netProfit}"></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
